<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ホーム | ウルトラZAIMUくん PC版</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="css/pc.css">
</head>
<body class="pc-body">
<div id="pc-app" class="pc-layout">
  <main class="pc-main" id="pc-main">
    <div class="pc-body-inner">
      <a href="transactions.html" class="pc-dashboard-card">
        <h3>取引一覧 →</h3>
        <p>売上・仕入原価・販管費を1画面で確認・編集／案件紐付けと粗利集計もこちら</p>
      </a>
      <div class="pc-card">
        <div class="pc-filter-row">
          <label>年
            <select id="pc-year" class="pc-select"></select>
          </label>
          <span class="text-muted" id="pc-status"></span>
          <div class="pc-tax-dl-row">
            <span class="text-muted" style="font-size:11px;">税理士用CSV:</span>
            <select id="pc-tax-from" class="pc-select" aria-label="開始月"></select>
            <span class="text-muted">〜</span>
            <select id="pc-tax-to" class="pc-select" aria-label="終了月"></select>
            <button id="pc-tax-dl-btn" class="pc-btn pc-btn--ghost" type="button">⬇️ DL</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="pl-table" id="pl-table">
            <thead><tr id="pl-head"></tr></thead>
            <tbody id="pl-body"></tbody>
          </table>
        </div>
      </div>
      <div class="pl-chart-wrap">
        <canvas id="pl-chart"></canvas>
      </div>

      <!-- 会計元帳ビュー（v0.15.0/v0.16.1・IT 導入補助金 インボイス対応類型 登録の会計 1 機能）
           G シリーズ共通の土台＝ ①科目別元帳（2 段深堀り＝ 上部 P&L テーブルで対応）／
           ②売掛金・買掛金元帳＋残高／③税率別消費税集計 -->
      <div class="pc-card" id="pc-ledger-card">
        <div class="pc-filter-row" style="flex-wrap:wrap;gap:12px;">
          <span style="font-weight:600;">会計元帳ビュー</span>
          <label>対象月
            <select id="pc-ledger-month" class="pc-select" aria-label="対象月"></select>
          </label>
          <span class="text-muted" style="font-size:11px;">売掛/買掛残高は累計・月フィルタは entries のみ</span>
        </div>

        <!-- ②売掛金・買掛金元帳＋残高 -->
        <div style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;">
            <div style="display:flex;gap:4px;">
              <button type="button" class="pc-btn pc-ledger-tab pc-ledger-tab--active" data-side="recv">売掛金</button>
              <button type="button" class="pc-btn pc-btn--ghost pc-ledger-tab" data-side="pay">買掛金</button>
            </div>
            <div style="font-size:13px;color:var(--uz-text2);display:flex;gap:16px;flex-wrap:wrap;">
              <span>売掛残高: <b id="pc-ledger-recv-balance" style="color:var(--uz-text);">—</b></span>
              <span>買掛残高: <b id="pc-ledger-pay-balance" style="color:var(--uz-text);">—</b></span>
            </div>
          </div>
          <div id="pc-ledger-body" style="border:1px solid var(--uz-border,#e5e7eb);border-radius:6px;overflow:hidden;"></div>
        </div>

        <!-- ③税率別消費税集計 -->
        <div style="margin-top:20px;">
          <div style="font-weight:600;margin-bottom:8px;">税率別消費税集計</div>
          <div id="pc-tax-body"></div>
          <div id="pc-tax-estimate" style="margin-top:8px;padding:8px 12px;background:rgba(0,0,0,0.03);border-radius:6px;font-size:13px;"></div>
        </div>
      </div>

      <!-- 直近入力 -->
      <div class="pc-card" id="pc-recent-card">
        <div class="pc-filter-row">
          <span style="font-weight:600;">直近の入力</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="pl-table" id="pc-recent-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>種別</th>
                <th>内容</th>
                <th class="num">金額</th>
              </tr>
            </thead>
            <tbody id="pc-recent-body"></tbody>
          </table>
        </div>
        <div id="pc-recent-empty" hidden style="padding:16px;text-align:center;color:var(--uz-text2);font-size:13px;">今月の記録はありません</div>
      </div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="../js/app.js"></script>
<script src="js/pc-common.js"></script>
<script src="js/pc-home.js"></script>
</body>
</html>
